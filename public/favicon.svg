<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#D97706" />
      <stop offset="85%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="goldShadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>
  </defs>

  <!-- Pitch Black Background Badge -->
  <rect width="100" height="100" rx="20" fill="#050507" />

  <g transform="translate(50, 50)">
    <!-- 4 Radial Ornate Crest Wings -->
    <!-- Top Wing -->
    <g transform="rotate(0)">
      <path d="M-18,-24 C-25,-32 -28,-18 -34,-14 C-36,-10 -30,-4 -22,-8 C-14,-12 -12,-20 -18,-24 Z" fill="url(#goldBase)" stroke="#FFF9E6" stroke-width="0.5" />
      <path d="M18,-24 C25,-32 28,-18 34,-14 C36,-10 30,-4 22,-8 C14,-12 12,-20 18,-24 Z" fill="url(#goldBase)" stroke="#FFF9E6" stroke-width="0.5" />
      <circle cx="-12" cy="-22" r="3.5" fill="url(#goldHighlight)" />
      <circle cx="12" cy="-22" r="3.5" fill="url(#goldHighlight)" />
      <polygon points="0,-18 -4,-24 0,-30 4,-24" fill="url(#goldGlow)" />
    </g>

    <!-- Right Wing -->
    <g transform="rotate(90)">
      <path d="M-18,-24 C-25,-32 -28,-18 -34,-14 C-36,-10 -30,-4 -22,-8 C-14,-12 -12,-20 -18,-24 Z" fill="url(#goldBase)" stroke="#FFF9E6" stroke-width="0.5" />
      <path d="M18,-24 C25,-32 28,-18 34,-14 C36,-10 30,-4 22,-8 C14,-12 12,-20 18,-24 Z" fill="url(#goldBase)" stroke="#FFF9E6" stroke-width="0.5" />
      <circle cx="-12" cy="-22" r="3.5" fill="url(#goldHighlight)" />
      <circle cx="12" cy="-22" r="3.5" fill="url(#goldHighlight)" />
      <rect x="-3" y="-26" width="6" height="6" fill="url(#goldHighlight)" transform="rotate(45)" />
    </g>

    <!-- Bottom Wing -->
    <g transform="rotate(180)">
      <path d="M-18,-24 C-25,-32 -28,-18 -34,-14 C-36,-10 -30,-4 -22,-8 C-14,-12 -12,-20 -18,-24 Z" fill="url(#goldBase)" stroke="#FFF9E6" stroke-width="0.5" />
      <path d="M18,-24 C25,-32 28,-18 34,-14 C36,-10 30,-4 22,-8 C14,-12 12,-20 18,-24 Z" fill="url(#goldBase)" stroke="#FFF9E6" stroke-width="0.5" />
      <circle cx="-12" cy="-22" r="3.5" fill="url(#goldHighlight)" />
      <circle cx="12" cy="-22" r="3.5" fill="url(#goldHighlight)" />
      <polygon points="0,-18 -4,-24 0,-30 4,-24" fill="url(#goldGlow)" />
    </g>

    <!-- Left Wing -->
    <g transform="rotate(270)">
      <path d="M-18,-24 C-25,-32 -28,-18 -34,-14 C-36,-10 -30,-4 -22,-8 C-14,-12 -12,-20 -18,-24 Z" fill="url(#goldBase)" stroke="#FFF9E6" stroke-width="0.5" />
      <path d="M18,-24 C25,-32 28,-18 34,-14 C36,-10 30,-4 22,-8 C14,-12 12,-20 18,-24 Z" fill="url(#goldBase)" stroke="#FFF9E6" stroke-width="0.5" />
      <circle cx="-12" cy="-22" r="3.5" fill="url(#goldHighlight)" />
      <circle cx="12" cy="-22" r="3.5" fill="url(#goldHighlight)" />
      <rect x="-3" y="-26" width="6" height="6" fill="url(#goldHighlight)" transform="rotate(45)" />
    </g>

    <!-- 4 Cardinal Faceted 3D Diamond Spikes -->
    <!-- Top Diamond Spike -->
    <polygon points="0,-48 14,-32 0,-34" fill="url(#goldHighlight)" />
    <polygon points="0,-48 -14,-32 0,-34" fill="url(#goldShadow)" />
    <polygon points="0,-34 14,-32 0,-20 -14,-32" fill="url(#goldBase)" />

    <!-- Bottom Diamond Spike -->
    <polygon points="0,48 14,32 0,34" fill="url(#goldHighlight)" />
    <polygon points="0,48 -14,32 0,34" fill="url(#goldShadow)" />
    <polygon points="0,34 14,32 0,20 -14,32" fill="url(#goldBase)" />

    <!-- Right Diamond Spike -->
    <polygon points="48,0 32,14 34,0" fill="url(#goldHighlight)" />
    <polygon points="48,0 32,-14 34,0" fill="url(#goldShadow)" />
    <polygon points="34,0 32,14 20,0 32,-14" fill="url(#goldBase)" />

    <!-- Left Diamond Spike -->
    <polygon points="-48,0 -32,14 -34,0" fill="url(#goldHighlight)" />
    <polygon points="-48,0 -32,-14 -34,0" fill="url(#goldShadow)" />
    <polygon points="-34,0 -32,14 -20,0 -32,-14" fill="url(#goldBase)" />

    <!-- Inner Void Center -->
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#050507" />
    <polygon points="0,-6 6,0 0,6 -6,0" fill="url(#goldHighlight)" />
  </g>
</svg>